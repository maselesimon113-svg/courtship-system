{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark font-weight-bold text-center">
                <h4>Admin Portal Login</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('admin_login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required placeholder="admin">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="admin123">
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Login as Admin</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
