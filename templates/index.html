{% extends 'base.html' %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 text-center">
    <h1 class="display-5 fw-bold">Welcome to Courtship System</h1>
    <p class="fs-4">Find your ideal partner easily and securely.</p>
    <a href="{{ url_for('register') }}" class="btn btn-primary btn-lg">Get Started / Register</a>
</div>

<div class="card mt-4">
    <div class="card-header bg-dark text-white">Admin Contact Information</div>
    <div class="card-body">
        <p><strong>Email:</strong> {{ admin['email'] }}</p>
        <p><strong>Phone:</strong> {{ admin['phone'] }}</p>
        <p><strong>Location:</strong> {{ admin['location'] }}</p>
    </div>
</div>
{% endblock %}
